[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/merge",
    "crates/workspace",
    "crates/agent",
    "crates/cli",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.98"
description = "Run multiple AI agents and terminal sessions in the same Git repository."
license = "MIT"
authors = ["Donald Pakkies <donaldpakkies@gmail.com>"]
homepage = "https://tessera.getlunaris.dev"
repository = "https://github.com/tessera-vcs/tessera"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
blake3 = "1.8.7"
sha1 = "0.11.0"
hex = "0.4.3"
flate2 = "1.1.10"
clap = { version = "4.6.7", features = ["derive", "env"] }
rayon = "1.12.0"
walkdir = "2.5.0"
ignore = "0.4.33"
libc = "0.2.191"
imara-diff = "0.2.0"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-json = "0.24.8"
tempfile = "3.27.0"

core = { path = "crates/core" }
merge = { path = "crates/merge" }
workspace = { path = "crates/workspace" }
agent = { path = "crates/agent" }

[workspace.lints.clippy]
collapsible_if = "allow"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

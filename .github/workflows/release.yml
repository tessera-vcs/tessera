name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Verify CI & Resolve Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml and verify CI passed
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CARGO_VER="$(grep -m1 '^version =' src/Cargo.toml | cut -d'"' -f2)"
          VSCODE_VER="$(node -p "require('./extensions/vscode/package.json').version")"

          if [ -z "$CARGO_VER" ]; then
            echo "❌ Failed to extract workspace version from src/Cargo.toml"
            exit 1
          fi

          if [ "$CARGO_VER" != "$VSCODE_VER" ]; then
            echo "❌ Version mismatch: src/Cargo.toml ($CARGO_VER) != extensions/vscode/package.json ($VSCODE_VER)"
            exit 1
          fi

          TAG="v${CARGO_VER}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "❌ Pushed git tag (${GITHUB_REF_NAME}) does not match src/Cargo.toml version ($TAG)"
            exit 1
          fi

          PASSED_RUNS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" --jq '.workflow_runs | map(select(.conclusion == "success")) | length')"
          if [ "${PASSED_RUNS}" -lt 1 ]; then
            echo "❌ Cannot release commit ${GITHUB_SHA}: no passed CI workflow run found for this commit."
            exit 1
          fi

          echo "✅ Verified passed CI run for ${GITHUB_SHA}. Releasing ${TAG}."
          echo "version=${CARGO_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon & Intel)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz

          # Linux x86_64 (glibc & static musl)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz

          # Linux ARM64 (glibc & static musl)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            use_cross: true

          # Windows (x86_64 & ARM64 MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: ${{ matrix.target }}

      - name: Install musl-tools on Linux x86_64
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross for Linux ARM64 targets
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary (cargo)
        if: matrix.use_cross != true
        working-directory: src
        run: cargo build --release -p cli --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.use_cross == true
        working-directory: src
        run: cross build --release -p cli --target ${{ matrix.target }}

      - name: Package Unix tar.gz archive and SHA-256 checksum
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp "src/target/${{ matrix.target }}/release/tes" stage/tes
          chmod +x stage/tes
          tar -C stage -czf "dist/tes-${{ matrix.target }}.tar.gz" tes
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "tes-${{ matrix.target }}.tar.gz" > "tes-${{ matrix.target }}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "tes-${{ matrix.target }}.tar.gz" > "tes-${{ matrix.target }}.tar.gz.sha256")
          fi

      - name: Package Windows zip archive and SHA-256 checksum
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist, stage | Out-Null
          Copy-Item "src\target\${{ matrix.target }}\release\tes.exe" "stage\tes.exe"
          $zipName = "tes-${{ matrix.target }}.zip"
          Compress-Archive -Path "stage\tes.exe" -DestinationPath "dist\$zipName" -Force
          $hash = (Get-FileHash -Path "dist\$zipName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Set-Content -Path "dist\$zipName.sha256" -Encoding ASCII

      - name: Verify Unix installer (install.sh)
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          TEST_HOME="$(mktemp -d)"
          TEST_BIN_DIR="${TEST_HOME}/.local/bin"
          HOME="${TEST_HOME}" TES_BASE_URL="file://${PWD}/dist" TES_INSTALL_DIR="${TEST_BIN_DIR}" sh docs/public/install.sh
          "${TEST_BIN_DIR}/tes" --version

      - name: Verify Windows installer (install.ps1)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testInstallDir = Join-Path $env:TEMP ("tes-verify-install-" + [guid]::NewGuid().ToString("N"))
          $env:TES_BASE_URL = "file:///" + ($PWD.Path -replace '\\', '/') + "/dist"
          $env:TES_INSTALL_DIR = $testInstallDir
          & .\docs\public\install.ps1
          & (Join-Path $testInstallDir "tes.exe") --version
          if ($LASTEXITCODE -ne 0) {
              throw "Installed tes.exe failed --version check"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  build-bsd-binaries:
    name: Build BSD (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            target: x86_64-unknown-freebsd
          - os: openbsd
            target: x86_64-unknown-openbsd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build on FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust curl
          run: |
            cargo build --manifest-path src/Cargo.toml --release -p cli
            mkdir -p dist stage
            cp src/target/release/tes stage/tes
            chmod +x stage/tes
            tar -C stage -czf "dist/tes-${{ matrix.target }}.tar.gz" tes
            (cd dist && sha256 -r "tes-${{ matrix.target }}.tar.gz" | awk '{print $1 "  " $2}' > "tes-${{ matrix.target }}.tar.gz.sha256")
            TEST_HOME="$(mktemp -d)"
            HOME="${TEST_HOME}" TES_BASE_URL="file://$(pwd)/dist" TES_INSTALL_DIR="${TEST_HOME}/bin" sh docs/public/install.sh
            "${TEST_HOME}/bin/tes" --version

      - name: Build on OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add rust curl
          run: |
            cargo build --manifest-path src/Cargo.toml --release -p cli
            mkdir -p dist stage
            cp src/target/release/tes stage/tes
            chmod +x stage/tes
            tar -C stage -czf "dist/tes-${{ matrix.target }}.tar.gz" tes
            (cd dist && sha256 -r "tes-${{ matrix.target }}.tar.gz" | awk '{print $1 "  " $2}' > "tes-${{ matrix.target }}.tar.gz.sha256")
            TEST_HOME="$(mktemp -d)"
            HOME="${TEST_HOME}" TES_BASE_URL="file://$(pwd)/dist" TES_INSTALL_DIR="${TEST_HOME}/bin" sh docs/public/install.sh
            "${TEST_HOME}/bin/tes" --version

      - name: Upload BSD artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  build-vscode-extension:
    name: Package VS Code Extension (.vsix)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Compile and package VSIX
        working-directory: extensions/vscode
        run: |
          mkdir -p ../../dist
          npm ci
          npm run compile
          npx --yes @vscode/vsce package --no-dependencies -o ../../dist/tessera-vscode.vsix
          (cd ../../dist && sha256sum tessera-vscode.vsix > tessera-vscode.vsix.sha256)

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-vscode-extension
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-binaries
      - build-bsd-binaries
      - build-vscode-extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag "${{ needs.prepare.outputs.tag }}" --output CHANGELOG.md

      - name: Commit and push CHANGELOG.md
        id: changelog_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update CHANGELOG.md for ${{ needs.prepare.outputs.tag }} [skip ci]"
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare SHA256SUMS.txt
        run: |
          (
            cd release-assets
            cat *.sha256 > SHA256SUMS.txt
          )
          ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ steps.changelog_commit.outputs.sha }}
          generate_release_notes: true
          files: release-assets/*

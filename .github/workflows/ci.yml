name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      vscode: ${{ steps.filter.outputs.vscode }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check modified paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'docs/public/install.sh'
              - 'docs/public/install.ps1'
            vscode:
              - 'extensions/vscode/**'
              - 'cliff.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/ci.yml'

  rust-matrix:
    name: Rust Lint & Test (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Install shells on Linux (zsh, bash, fish, dash, ksh, mksh, yash, tcsh, csh, elvish)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh bash fish dash ksh mksh yash tcsh csh elvish

      - name: Install shells on macOS (bash 5, fish, dash, mksh, oksh, yash, elvish, nushell)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install --formula bash fish dash mksh oksh yash elvish nushell

      - name: Verify Unix installer and E2E script syntax
        if: runner.os != 'Windows'
        run: |
          sh -n docs/public/install.sh
          bash -n scripts/ci_multi_shell_e2e.sh

      - name: Verify PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path "docs\public\install.ps1").Path,
              [ref]$tokens,
              [ref]$errors
          )
          if ($errors -and $errors.Count -gt 0) {
              $msg = ($errors | ForEach-Object { $_.Message }) -join "; "
              throw "PowerShell syntax errors in docs/public/install.ps1: $msg"
          }

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "Tessera CI"
          git config --global user.email "ci@tessera.getlunaris.dev"
          git config --global init.defaultBranch main

      - name: Check formatting (rustfmt)
        working-directory: src
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        working-directory: src
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit, integration, and doc tests
        working-directory: src
        run: cargo test --workspace

      - name: Run multi-shell E2E suite (Linux & macOS)
        if: runner.os != 'Windows'
        env:
          TES_BIN: ${{ github.workspace }}/src/target/debug/tes
        run: ./scripts/ci_multi_shell_e2e.sh

      - name: Execute Unix installer (install.sh) E2E
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) RUST_ARCH="x86_64" ;;
            arm64|aarch64) RUST_ARCH="aarch64" ;;
            *) echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
          esac
          if [ "$(uname -s)" = "Darwin" ]; then
            TARGET="${RUST_ARCH}-apple-darwin"
          else
            TARGET="${RUST_ARCH}-unknown-linux-musl"
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "${TMP_DIR}/stage" "${TMP_DIR}/dist" "${TMP_DIR}/home"
          cp "${GITHUB_WORKSPACE}/src/target/debug/tes" "${TMP_DIR}/stage/tes"
          chmod +x "${TMP_DIR}/stage/tes"
          tar -C "${TMP_DIR}/stage" -czf "${TMP_DIR}/dist/tes-${TARGET}.tar.gz" tes
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "${TMP_DIR}/dist" && sha256sum "tes-${TARGET}.tar.gz" > "tes-${TARGET}.tar.gz.sha256")
          else
            (cd "${TMP_DIR}/dist" && shasum -a 256 "tes-${TARGET}.tar.gz" > "tes-${TARGET}.tar.gz.sha256")
          fi

          # Fresh install and atomic in-place reinstall.
          HOME="${TMP_DIR}/home" TES_BASE_URL="file://${TMP_DIR}/dist" TES_INSTALL_DIR="${TMP_DIR}/home/.local/bin" sh docs/public/install.sh
          HOME="${TMP_DIR}/home" TES_BASE_URL="file://${TMP_DIR}/dist" TES_INSTALL_DIR="${TMP_DIR}/home/.local/bin" sh docs/public/install.sh
          "${TMP_DIR}/home/.local/bin/tes" --version

      - name: Run Windows PowerShell E2E lifecycle test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $origDir = $PWD.Path
          $tesBin = Join-Path $origDir "src\target\debug\tes.exe"
          $env:PATH = (Split-Path $tesBin -Parent) + ";" + $env:PATH

          function Assert-Ok([string]$Label) {
              if ($LASTEXITCODE -ne 0) {
                  throw "$Label failed with exit code $LASTEXITCODE"
              }
          }

          $workDir = Join-Path $env:TEMP ("tes-win-e2e-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path (Join-Path $workDir "src") | Out-Null

          try {
              Set-Location $workDir

              @"
          pub fn alpha() -> i32 {
              10
          }

          pub fn beta() -> i32 {
              20
          }
          "@ | Set-Content -Path "src\lib.rs" -Encoding UTF8

              & $tesBin init --branch main
              Assert-Ok "tes init"

              Invoke-Expression (& $tesBin env --pwsh)

              tes switch feat/win-pwsh
              if ($env:TES_BRANCH -ne "feat/win-pwsh") {
                  throw "Expected TES_BRANCH=feat/win-pwsh, got $($env:TES_BRANCH)"
              }

              tes switch main
              if ($env:TES_BRANCH -ne "main") {
                  throw "Expected TES_BRANCH=main, got $($env:TES_BRANCH)"
              }

              $statusJson = (& $tesBin status --json | Out-String) | ConvertFrom-Json
              Assert-Ok "tes status --json"
              if ($statusJson.active_branch -ne "main") {
                  throw "Expected tes status active_branch=main, got $($statusJson.active_branch)"
              }

              $env:TES_SESSION_ID = "win-agent-a"
              & $tesBin claim --branch feat/win-a --intent "Update alpha" src/lib.rs
              Assert-Ok "tes claim win-a"

              @"
          pub fn alpha() -> i32 {
              100
          }

          pub fn beta() -> i32 {
              20
          }
          "@ | Set-Content -Path "src\lib.rs" -Encoding UTF8

              & $tesBin hook post-tool --path src/lib.rs
              Assert-Ok "tes hook post-tool win-a"

              $diffOut = (& $tesBin diff | Out-String)
              Assert-Ok "tes diff"
              if ($diffOut -notmatch "100") {
                  throw "Expected tes diff to include '100', got: $diffOut"
              }

              & $tesBin commit -m "feat(win-a): update alpha"
              Assert-Ok "tes commit win-a"

              $env:TES_SESSION_ID = "win-agent-b"
              & $tesBin claim --branch feat/win-b --intent "Update beta" src/lib.rs
              Assert-Ok "tes claim win-b"

              @"
          pub fn alpha() -> i32 {
              10
          }

          pub fn beta() -> i32 {
              200
          }
          "@ | Set-Content -Path "src\lib.rs" -Encoding UTF8

              & $tesBin hook post-tool --path src/lib.rs
              Assert-Ok "tes hook post-tool win-b"

              & $tesBin commit -m "feat(win-b): update beta"
              Assert-Ok "tes commit win-b"

              $env:TES_SESSION_ID = "editor"
              & $tesBin merge feat/win-a feat/win-b --into main -m "feat: merge win-a and win-b"
              Assert-Ok "tes merge"

              $merged = Get-Content -Path "src\lib.rs" -Raw
              if (($merged -notmatch "100") -or ($merged -notmatch "200")) {
                  throw "3-way AST merge failed on Windows: $merged"
              }

              & $tesBin radar | Out-Null
              Assert-Ok "tes radar"

              $doctorJson = (& $tesBin doctor --json | Out-String) | ConvertFrom-Json
              Assert-Ok "tes doctor --json"
              if (-not $doctorJson.checks) {
                  throw "tes doctor --json missing checks array"
              }

              Add-Content -Path "src\lib.rs" -Value "`n// win stash test"
              & $tesBin stash push -m "win stash test"
              Assert-Ok "tes stash push"

              $afterPush = Get-Content -Path "src\lib.rs" -Raw
              if ($afterPush -match "win stash test") {
                  throw "tes stash push did not revert working tree"
              }

              $stashList = (& $tesBin stash list | Out-String)
              Assert-Ok "tes stash list"
              if ($stashList -notmatch "win stash test") {
                  throw "tes stash list missing pushed stash: $stashList"
              }

              & $tesBin stash pop
              Assert-Ok "tes stash pop"

              $afterPop = Get-Content -Path "src\lib.rs" -Raw
              if ($afterPop -notmatch "win stash test") {
                  throw "tes stash pop did not restore stashed change"
              }

              & $tesBin restore src/lib.rs
              Assert-Ok "tes restore"

              $mcpRequests = @(
                  '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}',
                  '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
              ) -join "`n"
              $mcpLines = @($mcpRequests | & $tesBin mcp) | Where-Object { $_.Trim() -ne "" }
              Assert-Ok "tes mcp"
              if ($mcpLines.Count -lt 2) {
                  throw "Expected at least 2 JSON-RPC responses from tes mcp, got $($mcpLines.Count)"
              }

              $initResp = $mcpLines[0] | ConvertFrom-Json
              $toolsResp = $mcpLines[1] | ConvertFrom-Json
              if ($initResp.id -ne 1 -or $initResp.result.serverInfo.name -ne "tessera") {
                  throw "Unexpected MCP initialize response: $($mcpLines[0])"
              }

              if ($toolsResp.id -ne 2 -or $toolsResp.result.tools.Count -lt 1) {
                  throw "Unexpected MCP tools/list response: $($mcpLines[1])"
              }

              $directCompletions = @(& $tesBin complete --shell plain --cword 2 -- tes switch "")
              Assert-Ok "tes complete"
              if ($directCompletions -notcontains "feat/win-pwsh") {
                  throw "Expected 'feat/win-pwsh' in tes complete output, got: $($directCompletions -join ', ')"
              }

              $pwshCompletions = @(
                  (TabExpansion2 -inputScript "tes switch " -cursorColumn 11).CompletionMatches |
                      ForEach-Object { $_.CompletionText }
              )
              if ($pwshCompletions -notcontains "feat/win-pwsh") {
                  throw "Expected 'feat/win-pwsh' from PowerShell TabExpansion2 completion, got: $($pwshCompletions -join ', ')"
              }

              git fsck --full
              Assert-Ok "git fsck"
              Write-Host "Windows PowerShell E2E passed!"
          } finally {
              Set-Location $origDir
              Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue
          }

      - name: Execute Windows installer (install.ps1) E2E in pwsh and Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tmpDir = Join-Path $env:TEMP ("tes-ps1-e2e-" + [guid]::NewGuid().ToString("N"))
          $stageDir = Join-Path $tmpDir "stage"
          $distDir = Join-Path $tmpDir "dist"
          $installPwsh = Join-Path $tmpDir "install-pwsh"
          $installPs51 = Join-Path $tmpDir "install-ps51"

          try {
              New-Item -ItemType Directory -Force -Path $stageDir, $distDir | Out-Null
              Copy-Item "src\target\debug\tes.exe" (Join-Path $stageDir "tes.exe")

              $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
              $target = if ($arch -eq "arm64") { "aarch64-pc-windows-msvc" } else { "x86_64-pc-windows-msvc" }
              $zipName = "tes-$target.zip"
              $zipPath = Join-Path $distDir $zipName
              Compress-Archive -Path (Join-Path $stageDir "tes.exe") -DestinationPath $zipPath -Force
              $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
              [System.IO.File]::WriteAllText((Join-Path $distDir "$zipName.sha256"), "$hash  $zipName`n", [System.Text.UTF8Encoding]::new($false))

              $baseUrl = "file:///" + ($distDir -replace '\\', '/')
              $scriptPath = (Resolve-Path "docs\public\install.ps1").Path

              # Execute in PowerShell 7 (pwsh) for fresh install and overwrite.
              $env:TES_BASE_URL = $baseUrl
              $env:TES_INSTALL_DIR = $installPwsh
              & $scriptPath
              & $scriptPath
              & (Join-Path $installPwsh "tes.exe") --version
              if ($LASTEXITCODE -ne 0) {
                  throw "pwsh installed tes.exe failed --version"
              }

              # Execute in Windows PowerShell 5.1 with redirected output to catch stderr NativeCommandError regressions.
              $env:TES_INSTALL_DIR = $installPs51
              $ps51Out = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $scriptPath 2>&1
              if ($LASTEXITCODE -ne 0) {
                  throw "Windows PowerShell 5.1 install.ps1 failed (exit $LASTEXITCODE): $($ps51Out -join "`n")"
              }
              & (Join-Path $installPs51 "tes.exe") --version
              if ($LASTEXITCODE -ne 0) {
                  throw "Windows PowerShell 5.1 installed tes.exe failed --version"
              }
              Write-Host "Windows install.ps1 E2E passed in both pwsh and Windows PowerShell 5.1!"
          } finally {
              Remove-Item -Recurse -Force $tmpDir -ErrorAction SilentlyContinue
          }

  bsd-matrix:
    name: BSD Cross-Platform Tests (FreeBSD & OpenBSD)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            prepare: pkg install -y git rust bash fish dash mksh yash
          - os: openbsd
            prepare: pkg_add git rust bash fish dash tcsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests on FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: ${{ matrix.prepare }}
          run: |
            git config --global user.name "Tessera BSD CI"
            git config --global user.email "ci@tessera.getlunaris.dev"
            git config --global init.defaultBranch main
            cargo test --manifest-path src/Cargo.toml --workspace
            TES_BIN=./src/target/debug/tes bash ./scripts/ci_multi_shell_e2e.sh

      - name: Run tests on OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: ${{ matrix.prepare }}
          run: |
            git config --global user.name "Tessera BSD CI"
            git config --global user.email "ci@tessera.getlunaris.dev"
            git config --global init.defaultBranch main
            cargo test --manifest-path src/Cargo.toml --workspace
            TES_BIN=./src/target/debug/tes bash ./scripts/ci_multi_shell_e2e.sh

  vscode-and-docs:
    name: VS Code Extension & Docs Build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.vscode == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve workspace version
        id: meta
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.vscode == 'true'
        run: |
          VER="$(python3 -c 'import tomllib; print(tomllib.load(open("src/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Verify root git-cliff changelog generation
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.vscode == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag "${{ steps.meta.outputs.tag }}" --output /tmp/ci-root-changelog.md

      - name: Verify VS Code extension git-cliff changelog generation
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.vscode == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: extensions/vscode/cliff.toml
          args: --verbose --include-path "extensions/vscode/**" --include-path "CHANGELOG.md" --tag "${{ steps.meta.outputs.tag }}" --output /tmp/ci-vscode-changelog.md

      - name: Inspect generated changelogs
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.vscode == 'true'
        run: |
          set -euo pipefail
          test -s /tmp/ci-root-changelog.md
          test -s /tmp/ci-vscode-changelog.md
          echo "=== GENERATED EXTENSION CHANGELOG ==="
          cat /tmp/ci-vscode-changelog.md
          grep -q "^## \[$VER_ESCAPED\]" /tmp/ci-root-changelog.md || grep -q "^## \[" /tmp/ci-root-changelog.md
          grep -q "^## \[0\.0\.1\]" /tmp/ci-vscode-changelog.md
          grep -q "^## \[0\.0\.2\]" /tmp/ci-vscode-changelog.md
          if grep -Eq "^- \*\((cli|core|merge|workspace|agent|ci)\)\*" /tmp/ci-vscode-changelog.md; then
            echo "Non-extension scoped commit leaked into extensions/vscode/CHANGELOG.md!" >&2
            exit 1
          fi
        env:
          VER_ESCAPED: ${{ steps.meta.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build, Typecheck & Verify VSIX Packaging
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.vscode == 'true'
        working-directory: extensions/vscode
        run: |
          set -euo pipefail
          npm ci
          npm run compile
          VSIX_FILES="$(npx --yes @vscode/vsce@4.1.1 ls --no-dependencies)"
          echo "$VSIX_FILES" | grep -qx "CHANGELOG.md"
          ! echo "$VSIX_FILES" | grep -qx "cliff.toml"
          npx --yes @vscode/vsce@4.1.1 package --no-dependencies -o /tmp/tessera-ci-check.vsix
          rm -f /tmp/tessera-ci-check.vsix

      - name: Build VitePress Documentation
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true'
        working-directory: docs
        run: |
          npm ci
          npm run docs:build
